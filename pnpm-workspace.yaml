packages:
  - apps/*
  - packages/*
  - tools/*
allowBuilds:
  '@prisma/engines': true # descarga el motor de migraciones (binario nativo)
  '@scarf/scarf': false # telemetría de descargas (llega vía @nestjs/swagger); no la necesitamos
  esbuild: true # verifica el binario nativo de esbuild (lo usa tsx para correr TypeScript)
  prisma: true # prepara el CLI de Prisma
