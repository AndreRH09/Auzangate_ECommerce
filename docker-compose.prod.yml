# Despliegue con Docker en puertos predeterminados. Se usa con -f (no se carga solo).
x-database-url: &database-url
  # host "mysql" = nombre del servicio; usuario limitado, no root
  DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-auzangate}

services:
  mysql:
    # sin "ports": MySQL solo es accesible dentro de la red de Docker (la API llega por "mysql:3306")
    environment:
      MYSQL_USER: ${MYSQL_USER:?Define MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD}

  # Aplica las migraciones pendientes y termina. La API arranca solo si esto sale bien.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment: *database-url
    depends_on:
      mysql:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      <<: *database-url
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false} # /docs apagado en producción salvo que se pida
    depends_on:
      migrate:
        condition: service_completed_successfully
