name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Un push nuevo a la misma rama cancela la corrida anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: auzangate_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/auzangate_test
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # versión desde "packageManager" del package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # typecheck primero: genera el cliente de Prisma y los tipos de rutas de Next que usa el lint
      - run: pnpm typecheck
      - run: pnpm lint

      - name: Migraciones y catálogo de ejemplo (lo usan los e2e)
        run: pnpm --filter api exec prisma migrate deploy && pnpm --filter api db:seed catalog
      - name: Tests
        run: pnpm test && pnpm --filter api test:e2e

      - name: Build de la API
        run: pnpm --filter api build

      # El build de Next pre-genera /es, /en y el sitemap con datos del catálogo: necesita la API viva
      - name: Levantar la API para el build
        working-directory: apps/api
        run: |
          node dist/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/health && exit 0; sleep 1; done
          cat /tmp/api.log; exit 1

      - name: Build del worker (OpenNext)
        run: pnpm --filter web exec opennextjs-cloudflare build
      - name: Tamaño del worker (< 2.8 MiB gzip; el límite del plan gratuito es 3 MiB)
        working-directory: apps/web
        run: |
          out=$(pnpm exec wrangler deploy --dry-run --outdir /tmp/worker 2>&1)
          echo "$out"
          kib=$(echo "$out" | grep -oP 'gzip: \K[0-9.]+(?= KiB)')
          echo "Worker gzip: ${kib} KiB" >> "$GITHUB_STEP_SUMMARY"
          awk -v k="$kib" 'BEGIN { if (k == "" || k > 2867) { print "Worker demasiado grande o tamaño no leído: " k " KiB"; exit 1 } }'

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Imagen runtime de la API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          tags: auzangate-api:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Imagen de migraciones
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          cache-from: type=gha
      - name: Tamaño de la imagen
        # bloque "|": el ": " dentro del comando rompería el YAML en una sola línea
        run: |
          docker image ls auzangate-api:ci --format 'API runtime: {{.Size}}' >> "$GITHUB_STEP_SUMMARY"
