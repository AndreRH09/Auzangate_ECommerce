# Desarrollo local. Docker Compose carga este archivo automáticamente con `docker compose up`.
services:
  mysql:
    ports:
      - "${MYSQL_PORT:-3306}:3306" # para Prisma y la API corriendo en Windows

  adminer:
    image: adminer:6
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy
